apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ocpair03: on OpenShift 4.20 the Ingress Operator owns this Subscription (it installs
# Service Mesh 3 for Gateway API) and writes channel, installPlanApproval and startingCSV.
# Git holds the same values, so ArgoCD does not fight it.
resources:
  - ../stable-3.x

patches:
  - target:
      kind: Subscription
      name: servicemeshoperator3
    path: patch-subscription.yaml
